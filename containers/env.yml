# Versiones fijadas, todas comprobadas contra el canal antes de escribirlas.
#
# Esta imagen es la alternativa "todo en uno" para quien no quiera tirar de un
# contenedor por proceso. El pipeline, por defecto, usa una imagen distinta y
# fijada para cada paso (ver `container_*` en nextflow.config): asi una
# herramienta no arrastra a las demas cuando se actualiza.
name: nf16s
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.7
  - curl=8.22.0
  - coreutils=9.12
  - fastp=0.24.0
  - kraken2=2.1.3
  - multiqc=1.25.1
