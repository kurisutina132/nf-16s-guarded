# Versiones fijadas, todas comprobadas contra el canal antes de escribirlas.
#
# Esta imagen NO es un extra: los procesos de descarga del pipeline la usan.
# Se dejo de depender de una imagen de terceros porque el empaquetado ajeno
# decide que hay dentro, y eso ya costo dos corridas rojas: debian:12.11-slim
# no traia curl, y buildpack-deps:bookworm-curl no trae ps, que Nextflow
# necesita en el contenedor para recoger metricas de la tarea.
#
# Minimo que esta imagen tiene que proveer, y que tests/test_imagen.py exige
# EJECUTANDOLA, no leyendo este fichero: curl, tar, ps, ca-certificates.
name: nf16s
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.7
  - curl=8.22.0
  - coreutils=9.12
  - tar=1.35
  - procps-ng=4.0.6          # da `ps`, que Nextflow exige dentro del contenedor
  - ca-certificates=2026.7.22
  - fastp=0.24.0
  - kraken2=2.1.3
  - multiqc=1.25.1
