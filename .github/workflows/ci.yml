# CI de nf-16s-guarded.
#
# El objetivo de este fichero es una cosa concreta: demostrar que el repositorio
# funciona en una maquina limpia que no es la de quien lo escribio. De ahi el
# orden de los trabajos, de mas barato a mas caro, y de ahi que el ultimo corra
# el pipeline de verdad contra datos reales de ENA.
#
# Las acciones van fijadas por SHA de commit, no por etiqueta: `@v7` se mueve
# igual que se mueve una etiqueta de imagen, y una dependencia que cambia sola
# no esta fijada.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NXF_VER: 26.04.6
  NXF_ANSI_LOG: false

jobs:

  # -------------------------------------------------------------------------
  # 1. Lo barato primero: si el arbol menciona una herramienta o un commit va
  #    mal firmado, no hace falta gastar cinco minutos en descargar nada.
  # -------------------------------------------------------------------------
  pruebas-rapidas:
    name: pruebas sin red ni contenedores
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0      # test_autoria.py mira TODA la historia

      - name: pruebas de atribucion, autoria y de cada pieza
        run: make test

  # -------------------------------------------------------------------------
  # 2. La imagen propia se construye de verdad. Su comprobacion de humo falla
  #    si alguna herramienta no responde con la version fijada.
  # -------------------------------------------------------------------------
  imagen:
    name: construir la imagen del pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: docker build
        run: docker build -f containers/Dockerfile -t nf-16s-guarded:ci .

      - name: las versiones dentro de la imagen son las fijadas
        run: |
          docker run --rm nf-16s-guarded:ci bash -lc '
            set -euo pipefail
            fastp --version 2>&1 | grep -q "0\.24\.0"
            kraken2 --version  | grep -q "2\.1\.3"
            multiqc --version  | grep -q "1\.25\.1"
            curl --version     | head -1
            echo "imagen conforme"
          '

  # -------------------------------------------------------------------------
  # 3. Las guardas, atacadas. Sin red: sirven sus propios FASTQ desde
  #    127.0.0.1 y usan una base 16S de relleno.
  #
  #    Corren sobre el ejecutor local, NO con perfil de contenedor: un
  #    contenedor no veria el 127.0.0.1 del anfitrion sin red de anfitrion.
  #    Por eso las herramientas se instalan en el runner, con los mismos pines
  #    que la imagen (containers/env.yml es la unica fuente de versiones).
  # -------------------------------------------------------------------------
  ataques:
    name: ataques a las guardas
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39  # v3.2.1
        with:
          environment-file: containers/env.yml
          cache-environment: true

      - name: instalar nextflow ${{ env.NXF_VER }}
        run: |
          curl -fsSL https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist \
            -o "${HOME}/nextflow"
          chmod +x "${HOME}/nextflow"
          echo "${HOME}" >> "${GITHUB_PATH}"

      - name: nextflow responde
        run: nextflow -version

      - name: atacar cada guarda
        shell: bash -el {0}          # -l para que el entorno de micromamba este activo
        run: make test-ataques

  # -------------------------------------------------------------------------
  # 4. Lo que de verdad demuestra el repositorio: el pipeline entero, con
  #    contenedores, sobre dos muestras publicas reales de ENA.
  #
  #    Esto es lo que dice el badge. Si esto no pasa, el repositorio no sirve
  #    para lo que se hizo.
  # -------------------------------------------------------------------------
  pipeline-completo:
    name: pipeline completo (test,docker) sobre datos reales
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: instalar nextflow ${{ env.NXF_VER }}
        run: |
          curl -fsSL https://github.com/nextflow-io/nextflow/releases/download/v${NXF_VER}/nextflow-${NXF_VER}-dist \
            -o "${HOME}/nextflow"
          chmod +x "${HOME}/nextflow"
          echo "${HOME}" >> "${GITHUB_PATH}"

      # La base 16S son 112 MB y no cambia: se cachea por su propio md5, que es
      # justo la clave de cache correcta porque el almacen va direccionado por
      # contenido.
      - name: cachear la base 16S
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: references
          key: base16s-94ecb2c851f3e4f02335559d42013f0f

      - name: correr el pipeline
        run: nextflow run main.nf -profile test,docker

      - name: las salidas son las que se prometen
        run: |
          set -euo pipefail
          for f in results/provenance/provenance.yml \
                   results/quality_gate/quality_gate_summary.tsv \
                   results/multiqc/multiqc_report.html \
                   results/kraken2/ERR674093.kraken2.report.txt \
                   results/kraken2/ERR674112.kraken2.report.txt ; do
            test -s "$f" || { echo "falta o esta vacio: $f" >&2; exit 1; }
          done
          echo "--- puerta de calidad ---"
          cat results/quality_gate/quality_gate_summary.tsv
          grep -q $'2\t2\t2\t0\t0\t0' results/quality_gate/quality_gate_summary.tsv \
            || { echo "las dos muestras tenian que pasar la puerta" >&2; exit 1; }
          echo "--- checksums verificados ---"
          grep -c 'OK' results/checksums/*.md5.tsv

      - name: guardar los informes de la corrida
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: resultados
          path: |
            results/provenance/
            results/quality_gate/
            results/multiqc/multiqc_report.html
            results/pipeline_info/
          retention-days: 14
